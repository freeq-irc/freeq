        <h1>freeq</h1>
        <p>
          An IRC server where identity is an AT Protocol DID instead of a
          nickname. Every message carries a ULID <code>msgid</code> and an
          ed25519 signature, so a reader can check who said a thing without
          trusting the server that relayed it. Standard IRC clients still
          connect; AT-authenticated clients get portable, verifiable identity.
        </p>
