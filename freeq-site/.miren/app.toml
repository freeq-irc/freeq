name = "freeq-site"

# The blog is read from AT Protocol: posts are `site.standard.document` records
# in the author's own PDS, written by Leaflet. Not a secret — it's the same URI
# any reader can resolve — so it's declared here rather than set out of band.
#
# This MUST stay set. Without it the reader refuses to serve anything (the repo
# also holds a different publication, and serving "every document" would put the
# wrong posts on freeq.at), and /blog falls back to the local markdown files.
# Contributing repos: the publication owner plus every collaborator. A
# collaborator's posts live in their own repo (AT Protocol only lets you write to
# your own), so omitting one makes its posts invisible rather than erroring.
[[env]]
key = "FREEQ_BLOG_DID"
value = "did:plc:4qsyxmnsblo4luuycm3572bq,did:plc:3wbo7sapgihteh7h46773ru6"

[[env]]
key = "FREEQ_BLOG_PUBLICATION"
value = "at://did:plc:4qsyxmnsblo4luuycm3572bq/site.standard.publication/3mri2ajri7c2w"

[services.web]
# gthread: two sync workers meant 2 requests at a time, so a ~1,200-request
# scanner burst (2026-11-11 13:30Z) starved the pool and real visitors got
# "no sandbox became available within 120 seconds" for ~2 min.
# --graceful-timeout must stay under shutdown_timeout, or miren SIGKILLs the
# container on every idle-out (it did, on every single one).
command = "gunicorn --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 8 --graceful-timeout 5 app:app"
port = 8000

[services.web.concurrency]
mode = "auto"
shutdown_timeout = "15s"
