name: freeq-macos
options:
  bundleIdPrefix: at.freeq
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"

targets:
  freeq-macos:
    type: application
    platform: macOS
    sources:
      - path: freeq-macos
        type: group
      - path: Generated/freeq.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.freeq.macos
        PRODUCT_NAME: freeq
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS:
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "AuthenticationServices"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AVKit"
          - "-framework"
          - "Speech"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "Network"
          - "-lc++"
        CLANG_ENABLE_MODULES: YES
    info:
      path: freeq-macos/Info.plist
      properties:
        CFBundleDisplayName: freeq
        LSApplicationCategoryType: public.app-category.social-networking
        NSCameraUsageDescription: "freeq uses your camera for video calls."
        NSMicrophoneUsageDescription: "freeq uses your microphone for voice and video calls."
        NSSpeechRecognitionUsageDescription: "freeq uses on-device speech recognition to transcribe voice messages."
        # Register the freeq:// URL scheme so the Share Extension (and any
        # automation/agent) can hand content to the app via freeq://share.
        CFBundleURLTypes:
          - CFBundleURLName: at.freeq.macos
            CFBundleURLSchemes: [freeq]
    dependencies:
      # Static archive — link only. Embedding a .a breaks codesign.
      - framework: FreeqSDK.xcframework
        embed: false
      # "Send to freeq" Share Extension — embedded into Contents/PlugIns.
      - target: freeq-share
    preBuildScripts:
      - name: Check Rust FFI freshness
        script: '"$SRCROOT/scripts/check-ffi-source-fresh.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: freeq-macos/freeq-macos.entitlements
      properties:
        # Phase 1: sandbox ON (ADA/MAS prerequisite; late sandboxing would
        # invalidate everything tested before it).
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # iroh P2P listens for inbound peer connections.
        com.apple.security.network.server: true
        # AV calls + voice messages.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Uploads via open panel / drag-drop; image "Save" via save panel.
        com.apple.security.files.user-selected.read-write: true

  # App-hosted unit tests. The SwiftPM package covers the pure models; this
  # bundle is the only place AppState itself can be exercised, so the send
  # paths (venue resolution, optimistic apply, error surfacing) live here.
  freeq-macosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: freeq-macosTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.freeq.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        # The app target is `freeq-macos` but its product is `freeq.app`, and
        # the generated TEST_HOST follows the target name, so it points at an
        # app that was never built. Name the real one.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/freeq.app/Contents/MacOS/freeq"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: freeq-macos

  freeq-share:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.freeq.macos.share
        PRODUCT_NAME: freeq-share
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        # Extensions must be sandboxed. The URL-scheme handoff needs no
        # network or file access — it just opens freeq://share.
        com.apple.security.app-sandbox: true

# Schemes are generated: hand-edited scheme config (env vars, selection) is
# wiped by every `xcodegen generate`, so per-deployment schemes live HERE.
schemes:
  freeq-macos:
    build:
      targets:
        freeq-macos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - freeq-macosTests
  freeq-macos-zerosum:
    build:
      targets:
        freeq-macos: all
    run:
      config: Debug
      environmentVariables:
        IRC_SERVER: "irc.zerosum.org:6697"
        AUTH_BROKER_BASE: "https://irc.zerosum.org"
