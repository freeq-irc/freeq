name = "freeq-auth-broker"

[services.web]
port = 8081

[services.web.concurrency]
mode = "fixed"
num_instances = 1

[[services.web.disks]]
name = "broker-data"
mount_path = "/data"
size_gb = 2

[[services.web.env]]
key = "BROKER_SHARED_SECRET"
required = true
sensitive = true
description = "Shared secret with freeq-server (must match the value in the freeq-server secrets file)"

[[services.web.env]]
key = "BROKER_PUBLIC_URL"
value = "https://auth.freeq.at"

[[services.web.env]]
key = "FREEQ_SERVER_URL"
value = "https://irc.freeq.at"

[[services.web.env]]
key = "BROKER_DB_PATH"
value = "/data/broker.db"
