[package]
name = "freeq-sdk-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "freeq_sdk_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
freeq-sdk = { path = "../freeq-sdk", default-features = false, features = ["ring", "rustls-tls", "iroh-transport", "websocket"] }
# The key lookup's client provider, and the errors the SDK's store trait uses.
freeq-oauth = { path = "../freeq-oauth" }
reqwest = { workspace = true }
anyhow = { workspace = true }
uniffi = { version = "0.29", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
once_cell = "1"
chrono = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
aes-gcm = "0.10"

# AV (voice/video via MoQ SFU)
# iroh-live features:
#   opus       — Opus audio codec (required for audio)
#   h264       — H.264 video codec (required; gates moq-media's video codec
#                paths via the `any_video_codec` cfg)
#   av1        — AV1 decode/encode via pure-Rust rav1d/rav1e (no system libs).
#                Required because browsers publish screen/camera video as AV1;
#                without it native clients reject the track and show no video
#                ("AV1 support requires the `av1` feature"). We still ENCODE
#                H.264 outbound; this is purely to DECODE inbound AV1.
#   videotoolbox — Apple hardware H.264 encode/decode via VideoToolbox
# Deliberately omitted:
#   capture    — pulls rusty-capture; the Apple camera backend is stubbed
#                and we capture from Swift via AVCaptureSession instead
#   wgpu/metal-import/dmabuf-import — GPU surface rendering from Rust; Swift
#                handles rendering via AVSampleBufferDisplayLayer
moq-native = { git = "https://github.com/Frando/moq", branch = "deps/iroh-main", default-features = false, features = ["noq", "websocket", "aws-lc-rs"], optional = true }
moq-lite = { git = "https://github.com/Frando/moq", branch = "deps/iroh-main", optional = true }
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "edd9bcc530a615f3ab3a6919e96790a077905376", default-features = false, features = ["opus", "h264", "av1", "videotoolbox"], optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false, optional = true }
url = { version = "2", optional = true }

[features]
default = []
av = ["moq-native", "moq-lite", "iroh-live", "rustls", "url"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[lints]
workspace = true
