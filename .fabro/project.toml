# Fabro project configuration for freeq.
# https://docs.fabro.sh/execution/run-configuration
#
# These are PROJECT-WIDE DEFAULTS. Each workflow's workflow.toml inherits
# them and may override per-key. The goal of this setup is a fleet of agents
# that improve freeq around the clock, each opening a reviewable PR.

_version = 1

# ── Pull requests ────────────────────────────────────────────────────────
# Every successful run opens a PR from the agent's branch. Ready for review
# (not draft) so CI runs and you get pinged — but never auto-merged: a human
# clicks merge.
[run.pull_request]
enabled = true
draft = false
auto_merge = false
merge_strategy = "squash"

# ── Default model ────────────────────────────────────────────────────────
# Every workflow node names its model explicitly (claude-sonnet-5-5, or
# claude-opus-5-5 for hunt/explore/plan/implement). This run-level default is
# what Fabro uses *outside* the graph — notably to write the PR title/body
# after a run, which it does with a forced tool call. The 5.5 family rejects
# forced tool use (400 "tool_choice ... not supported"), so the default stays
# on claude-sonnet-4-6; with 5.5 here every green run failed to open its PR.
# Fabro 0.254's built-in catalog predates the 5.5 family, so both are
# declared as custom models on the executor (.fabro/executor/models.toml).
[run.model]
name = "claude-sonnet-4-6"

# ── Execution environment ────────────────────────────────────────────────
# Runs execute in a Docker container on the always-on boxd VM that hosts the
# Fabro server. The docker provider is clone-based: each run gets its own
# fresh clone on a run branch, so Fabro owns the branch → commit → push → PR
# lifecycle and runs can safely overlap.
#
# Why Docker and not one boxd fork per run: Fabro only executes runs on its
# built-in providers (local/docker/daytona), and both automations (cron) and
# auto-PRs require a clone-based one — `local` is rejected for both. Fabro's
# sandbox-driver plugins can't execute runs yet. When they can, a boxd plugin
# forking a warm golden VM per run is the better shape.
#
# Base image: `freeq-fabro:tools` (.fabro/Dockerfile.tools) — toolchain only
# (rustfmt/clippy, cmake, libasound2-dev, node, cargo-audit, sccache), no
# source/target. Built by .fabro/executor/provision.sh.
#
# Warm builds: containers start cold and the docker provider has no volume
# mounts, so sccache caches compiled crates in a WebDAV store on the host
# (172.17.0.1 is the docker bridge; see .fabro/executor/sccache-webdav.service).
# sccache can't cache incremental builds, hence CARGO_INCREMENTAL=0.
#
# Build profile: CARGO_PROFILE_*_DEBUG=0 turns OFF debug symbols — debug=2
# binaries blew the disk and bus-errored the linker on the original 2 vCPU VM.
# It doesn't change check/clippy/test correctness.
[run.environment]
id = "boxd-docker"

[environments.boxd-docker]
provider = "docker"

[environments.boxd-docker.image]
docker = "freeq-fabro:tools"

# The VM is 4 vCPU / 16 GB; leave headroom for the Fabro server + cache.
[environments.boxd-docker.resources]
cpu = 4
memory = "13GB"

[environments.boxd-docker.env]
CARGO_TERM_COLOR = "always"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_INCREMENTAL = "0"
RUSTC_WRAPPER = "sccache"
SCCACHE_WEBDAV_ENDPOINT = "http://172.17.0.1:8090"

# No prepare steps: the toolchain is baked into freeq-fabro:tools.

# ── Notifications → #freeq-dev ───────────────────────────────────────────
# HTTP hooks fire from the server host (never the sandbox) to the freeq-fabro
# relay bot (freeq-fabro/), which posts to #freeq-dev on irc.freeq.at.
# Loopback-only, hence tls = "off".
[[run.hooks]]
name = "freeq-run-start"
event = "run_start"
url = "http://127.0.0.1:8091/hook"
tls = "off"
blocking = false

[[run.hooks]]
name = "freeq-run-complete"
event = "run_complete"
url = "http://127.0.0.1:8091/hook"
tls = "off"

[[run.hooks]]
name = "freeq-run-failed"
event = "run_failed"
url = "http://127.0.0.1:8091/hook"
tls = "off"

# Human gates (hexagon nodes named approve*) — ping when a run is waiting on you.
[[run.hooks]]
name = "freeq-awaiting-approval"
event = "stage_start"
matcher = "^approve"
url = "http://127.0.0.1:8091/hook"
tls = "off"
blocking = false
