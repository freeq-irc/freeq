name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dev packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --exclude freeq-av-client --exclude freeq-eliza --exclude freeq-av --exclude freeq-av-image

      - name: Test
        run: cargo test --workspace --exclude freeq-av-client --exclude freeq-eliza --exclude freeq-av --exclude freeq-av-image

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux audio dev packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --exclude freeq-av-client --exclude freeq-eliza --exclude freeq-av --exclude freeq-av-image -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit (RustSec advisories)
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm audit (web client)
        working-directory: freeq-app
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (JS SDK)
        working-directory: freeq-sdk-js
        run: npm audit --omit=dev --audit-level=high

  site:
    name: Docs Site (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The site renders the repo's docs/ and generates llms.txt from a curated
      # slug registry, so a doc rename can break the agent entry point without
      # touching a line of Python. These tests follow every generated link.
      - name: Install
        working-directory: freeq-site
        run: pip install -r requirements.txt pytest

      - name: Test
        working-directory: freeq-site
        run: python -m pytest tests -q

  web:
    name: Web Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the version this repo is developed on. npm 10 (Node 20) and
      # npm 11+ disagree about whether a peer-only optional dependency belongs
      # hoisted in the lock file — `@emnapi/runtime`, via
      # `@napi-rs/wasm-runtime` — so `npm ci` on Node 20 rejected a lock file
      # any current dev machine regenerates, and whoever ran `npm install` last
      # decided whether CI passed. Matching the local toolchain removes the
      # disagreement (and Node 20 is deprecated on the runners besides).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            freeq-app/package-lock.json
            freeq-sdk-js/package-lock.json

      - name: Install SDK deps
        working-directory: freeq-sdk-js
        run: npm ci

      - name: Install
        working-directory: freeq-app
        run: npm ci

      - name: Type check
        working-directory: freeq-app
        run: npx tsc --noEmit

      - name: Build
        working-directory: freeq-app
        run: npm run build

  macos-swift:
    name: macOS Client (SwiftPM tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The SwiftPM harness compiles only the pure-logic core (no FFI, no
      # Xcode project), so this stays fast and needs no Rust toolchain.
      - name: Run Swift tests
        working-directory: freeq-macos
        run: swift test

  ios-swift:
    name: iOS Client (SwiftPM tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Mirrors macos-swift: the SwiftPM harness compiles only the pure-logic
      # core (ChatMessage + MessageActions) — no FFI, no Xcode project — so it
      # stays fast and needs no Rust toolchain or simulator.
      - name: Run Swift tests
        working-directory: freeq-ios
        run: swift test

  macos-smoke:
    name: macOS Client (interaction smoke test)
    # macos-26: the app uses macOS-26-only APIs (MetricKit) behind runtime
    # availability guards — correct on old systems at runtime, but the
    # symbols must exist at compile time, so the 26 SDK is required.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Build the full app and drive its core interactions (send / react /
      # delete / channel switch / stress) through the DebugBridge, asserting
      # on state snapshots. Catches wiring + crash regressions the unit tests
      # can't (they don't compile AppState or the AppKit list).
      #
      # The FFI staticlib is NOT checked in (.gitignore), so the Rust side
      # must be built here — this also keeps the app building against current
      # freeq-sdk instead of a stale artifact. 2026-08-18: the committed
      # pbxproj referenced files xcodegen never emitted and the app had not
      # compiled from a clean checkout for a week while this job was red.
      - name: Regenerate the Xcode project and check for drift
        working-directory: freeq-macos
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          # The project file is checked in AND generated: if a commit adds a
          # source file without regenerating it, the file silently never
          # compiles into the app (exactly the 2026-08-11 breakage). Fail
          # here instead of shipping an app missing code. If xcodegen itself
          # changed its output format, regenerate + commit once.
          git diff --exit-code -- freeq-macos.xcodeproj

      - name: Build the Rust FFI (freeq-sdk-ffi, AV)
        run: ./freeq-macos/build-rust.sh

      - name: Build the macOS app (Debug)
        working-directory: freeq-macos
        run: |
          xcodebuild -project freeq-macos.xcodeproj -scheme freeq-macos \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Run interaction smoke test
        working-directory: freeq-macos
        run: ./scripts/smoke.sh

  ios-build:
    name: iOS Client (compile check)
    # macos-26: same story as macos-smoke — iOS-26-only APIs (Liquid Glass
    # glassEffect) behind `if #available` fallbacks need the 26 SDK to
    # compile at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      # The iOS xcodeproj is gitignored (generated by xcodegen from
      # project.yml) and the FFI staticlib is gitignored too, so a broken
      # app target used to be invisible until someone built locally with a
      # fresh framework. Compile-only: links the real FFI and every Swift
      # source xcodegen globs in. No simulator run, no signing.
      - name: Build the Rust FFI (freeq-sdk-ffi, AV)
        run: ./freeq-ios/build-rust.sh

      - name: Build the iOS app (Simulator, unsigned)
        working-directory: freeq-ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -project freeq.xcodeproj -scheme freeq \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build

  android-unit:
    name: Android Client (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Mirrors ios-swift / macos-swift: runs the pure-logic JVM unit suite
      # (routers, reconnect, batching, unread, pin cache). The FFI Kotlin
      # bindings are checked in and the tests don't load the native lib, so no
      # Rust toolchain, NDK, or emulator is needed. Compiling the test variant
      # also compiles the app's Kotlin, so this catches build breaks too.
      - name: Run unit tests
        working-directory: freeq-android
        run: ./gradlew testFreeqDebugUnitTest
