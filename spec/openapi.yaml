  # ── auth ─────────────────────────────────────────────────────────────
  /auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      summary: Start the AT Protocol OAuth flow for a handle.
      parameters:
        - name: handle
          in: query
          required: true
          schema: { type: string }
          example: alice.bsky.social
        - name: mobile
          in: query
          description: '`1` to redirect to the `freeq://` scheme.'
          schema: { type: string, enum: ["1"] }
        - name: irc_state
          in: query
          description: Set when the flow came from the IRC `/login` command.
          schema: { type: string }
      security: [{}]
      responses:
        "302": { description: Redirect to the authorization server. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: OAuth redirect target; completes the flow.
      security: [{}]
      responses:
        "200": { description: HTML that hands the session to the client. }
        "302": { description: Redirect to the client. }
  /auth/step-up:
    get:
      tags: [auth]
      operationId: authStepUp
      summary: Incremental authorization for a specific scope.
      description: |
        Drives a second OAuth flow (image upload, Bluesky cross-post) without
        replacing the user's primary login session.
      security: [{}]
      responses:
        "302": { description: Redirect to the authorization server. }
  /auth/mobile:
    get:
      tags: [auth]
      operationId: authMobileRedirect
      summary: Hash-fragment bridge that redirects into the `freeq://` scheme.
      security: [{}]
      responses:
        "200": { description: HTML redirector. }
  /auth/broker/web-token:
    post:
      tags: [auth]
      operationId: brokerWebToken
      summary: Exchange a broker-signed request for a web session token.
      description: Authenticated by `X-Broker-Signature` over the raw body.
      security: [brokerSignature: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, handle]
              properties:
                did: { type: string }
                handle: { type: string }
      responses:
        "200":
          description: Session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerToken"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Broker auth not configured or bad signature. }
  /auth/broker/session:
    post:
      tags: [auth]
      operationId: brokerSession
      summary: Hand a broker-held OAuth session to this server.
      security: [brokerSignature: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { type: object }
        "403": { description: Broker auth not configured or bad signature. }
  /client-metadata.json:
    get:
      tags: [auth, discovery]
      operationId: getClientMetadata
      summary: AT Protocol OAuth client metadata document.
      security: [{}]
      responses:
        "200":
          description: Client metadata.
          content:
            application/json:
              schema: { type: object }

  # ── transport ────────────────────────────────────────────────────────
  /irc:
    get:
      tags: [transport]
      operationId: ircWebSocket
      summary: IRC over WebSocket.
      description: |
        Upgrade to a WebSocket carrying the IRC line protocol, including the
        `ATPROTO-CHALLENGE` SASL mechanism. Per-IP connection limits apply.
      security: [{}]
      responses:
        "101": { description: Switching protocols. }
        "429": { description: Per-IP connection limit reached. }
  /av/moq:
    get:
      tags: [transport]
      operationId: avMoqWebSocket
      summary: MoQ-over-WebSocket media transport (SFU).
      security: [{}]
      responses:
        "101": { description: Switching protocols. }
        "503": { description: Built without `--features av-native`. }
  /av/call:
    get:
      tags: [transport]
      operationId: avCallPage
      summary: Standalone AV call page.
      security: [{}]
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema: { type: string }
  /av/call.html:
    get:
      tags: [transport]
      operationId: avCallPageHtml
      summary: Alias of `/av/call`.
      security: [{}]
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema: { type: string }
  /av/assets/{filename}:
    get:
      tags: [transport]
      operationId: avAsset
      summary: Static asset for the AV call page.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      security: [{}]
      responses:
        "200": { description: Asset bytes. }
        "404": { $ref: "#/components/responses/NotFound" }
  /join/{channel}:
    get:
      tags: [transport]
      operationId: channelInvitePage
      summary: Shareable channel invite landing page.
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
      security: [{}]
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A freeq API bearer token. Obtained either from the `API-BEARER`
        NOTICE the server sends after a successful SASL `903`, or from
        `POST /auth/broker/web-token`. Identifies the caller by DID.
    brokerSignature:
      type: apiKey
      in: header
      name: X-Broker-Signature
      description: HMAC over the raw request body, using the broker shared secret.

  parameters:
    ChannelName:
      name: name
      in: path
      required: true
      description: Channel name, with or without the leading `#` (case-insensitive).
      schema: { type: string }
      example: "#general"
    PolicyChannel:
      name: channel
      in: path
      required: true
      schema: { type: string }
      example: "#general"
    Nick:
      name: nick
      in: path
      required: true
      schema: { type: string }
    Did:
      name: did
      in: path
      required: true
      schema: { type: string }
      example: did:plc:4qsyxmnsblo4luuycm3572bq
    MsgId:
      name: msgid
      in: path
      required: true
      description: ULID message id.
      schema: { type: string }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Maximum rows to return.
      schema: { type: integer, minimum: 1 }
    Before:
      name: before
      in: query
      description: Return only rows older than this Unix-seconds timestamp.
      schema: { type: integer, format: int64 }
    Since:
      name: since
      in: query
      description: Return only rows newer than this Unix-seconds timestamp.
      schema: { type: integer, format: int64 }

  requestBodies:
    AgentTool:
      required: true
      description: Tool-specific input object; see `/.well-known/agent.json`.
      content:
        application/json:
          schema:
            type: object

  responses:
    AgentTool:
      description: |
        Evidence bundle envelope: a conclusion plus the evidence behind it,
        with a `request_id` for audit correlation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentToolEnvelope"
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RestrictedChannel:
      description: |
        Channel is invite-only (`+i`) or key-protected (`+k`); its contents
        are not exposed over REST.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoDatabase:
      description: This server runs without persistence, so history is unavailable.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Health:
      type: object
      required: [server_name, version, connections, channels, uptime_secs, av]
      properties:
        server_name: { type: string }
        version: { type: string }
        git_commit: { type: string }
        connections: { type: integer }
        channels: { type: integer }
        uptime_secs: { type: integer, format: int64 }
        av:
          type: boolean
          description: AV built in (`--features av-native`) *and* SFU up.
    ChannelInfo:
      type: object
      required: [name, members]
      properties:
        name: { type: string }
        members: { type: integer }
        topic: { type: [string, "null"] }
    ChannelTopic:
      type: object
      required: [channel]
      properties:
        channel: { type: string }
        topic: { type: [string, "null"] }
        set_by: { type: [string, "null"] }
        set_at: { type: [integer, "null"], format: int64 }
    Message:
      type: object
      required: [id, sender, text, timestamp, tags]
      properties:
        id: { type: integer, format: int64 }
        sender:
          type: string
          description: IRC prefix (`nick!user@host`) or nick.
        text: { type: string }
        timestamp: { type: integer, format: int64 }
        tags:
          type: object
          additionalProperties: { type: string }
          description: IRCv3 message tags, including `+freeq.at/sig`.
        msgid: { type: string, description: ULID. }
    StoredMessage:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            channel: { type: string }
            sender_did: { type: [string, "null"] }
            replaces_msgid:
              type: [string, "null"]
              description: Set when this message is an edit of another.
    Pin:
      type: object
      properties:
        msgid: { type: string }
        pinned_by: { type: string }
        pinned_at: { type: integer, format: int64 }
        text: { type: string }
    User:
      type: object
      required: [nick, online]
      properties:
        nick: { type: string }
        online: { type: boolean }
        did: { type: [string, "null"] }
        handle: { type: [string, "null"] }
    Whois:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            channels:
              type: array
              items: { type: string }
    SigningKey:
      type: object
      properties:
        did: { type: string }
        kid: { type: string }
        alg: { type: string, examples: [ed25519] }
        public_key:
          type: string
          description: base64url (unpadded) raw public key bytes.
    VerifyResult:
      type: object
      properties:
        msgid: { type: string }
        verified: { type: boolean }
        signer: { type: string, description: DID or server name. }
        signed_by:
          type: string
          description: '`client` (session key) or `server` (fallback).'
        reason:
          type: string
          description: Why verification failed, when it did.
    Artifact:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        kind: { type: string }
        created_at: { type: integer, format: int64 }
        created_by: { type: string }
        content_ref: { type: string }
        content_type: { type: string }
        visibility: { type: string }
        title: { type: string }
    BrokerToken:
      type: object
      required: [token, nick, did, handle]
      properties:
        token: { type: string }
        nick: { type: string }
        did: { type: string }
        handle: { type: string }
    AgentDiscovery:
      type: object
      required: [service, version, assistance_endpoint, capabilities, auth]
      properties:
        service: { type: string, examples: [Freeq] }
        version: { type: string }
        description: { type: string }
        assistance_endpoint: { type: string, examples: ["/agent/tools"] }
        capabilities:
          type: array
          items: { type: string }
        auth:
          type: object
          properties:
            required: { type: boolean }
            methods:
              type: array
              items: { type: string }
    AgentToolEnvelope:
      type: object
      properties:
        request_id: { type: string }
        conclusion: { type: string }
        evidence: { type: object }
        caller: { type: object }
